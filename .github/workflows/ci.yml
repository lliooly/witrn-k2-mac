name: Offline checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Offline regression
        run: python -m unittest discover -s tests -v
      - name: Public documentation links
        run: python script/check_docs.py
  swift:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Swift regression (no USB)
        run: swift test --package-path macos
